services:
  # ==========================================
  # Base interna para configuracion y auditoria
  # Puerto host: 5559
  # ==========================================
  internal-config-db:
    image: postgres:15-alpine
    container_name: asignacion-internal-config-db
    environment:
      - POSTGRES_DB=internal_config_db
      - POSTGRES_USER=internal_config_user
      - POSTGRES_PASSWORD=internal_config_pass
      - PGDATA=/var/lib/postgresql/data/pgdata
    ports:
      - "5559:5432"
    volumes:
      # Persistencia en disco host para sobrevivir docker system prune
      - ./docker-data/internal-config-db:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U internal_config_user -d internal_config_db"]
      interval: 15s
      timeout: 5s
      retries: 8
    networks:
      - app-network

  # ================================
  # Servicio Principal: API FastAPI
  # ================================
  fastapi-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: asignacion-contratos-api
    user: "0:0"
    ports:
      - "8000:8000"
    environment:
      # Configuracion de la aplicacion
      - APP_NAME=Sistema de Asignacion de Contratos
      - APP_VERSION=1.0.0
      - DEBUG=False

      # MySQL (alocreditprod) - Configuracion externa
      - MYSQL_HOST=57.130.40.1
      - MYSQL_PORT=3306
      - MYSQL_USER=alo_estadisticas
      - MYSQL_PASSWORD=4K9ml8e2vqlj
      - MYSQL_DATABASE=alocreditprod

      # PostgreSQL (nexus_db) - Configuracion externa
      - POSTGRES_HOST=172.31.21.63
      - POSTGRES_PORT=5432
      - POSTGRES_USER=nexus_dev_84
      - POSTGRES_PASSWORD=ZehK7wQTpq95eU8r
      - POSTGRES_DATABASE=nexus_db

      # Configuracion de negocio
      - DAYS_THRESHOLD=61
      - MAX_DAYS_THRESHOLD=240
      - BLACKLIST_ENABLED=False
      - CLIENT_DOCUMENT_BLACKLIST=500102
      - CLIENT_DOCUMENT_BLACKLIST_FILE=app/data/client_document_blacklist.txt
      - EFFECT_ACUERDO_PAGO=acuerdo_de_pago
      - EFFECT_PAGO_TOTAL=pago_total
      - PAGO_TOTAL_VALIDITY_DAYS=30
      - FIXED_CONTRACT_EFFECT=pago_total
      - AUTO_ASSIGNMENT_ENABLED=True
      - AUTO_ASSIGNMENT_HOUR=5
      - AUTO_ASSIGNMENT_MINUTE=0
      - AUTO_ASSIGNMENT_TIMEZONE=America/Bogota
      - AUTO_ASSIGNMENT_WEEKDAYS=0,1,2,3,4,5,6
      - AUTO_NOTIFICATION_WEEKDAYS=0,1,2,3,4,5,6
      # Informe de finalizacion de ciclo (ultimo dia de cada mes)
      - MONTHLY_REPORT_ENABLED=True
      - MONTHLY_REPORT_HOUR=8
      - MONTHLY_REPORT_MINUTE=0
      - MONTHLY_REPORT_TO=jcarrasco@alocredit.co
      - MONTHLY_REPORT_CC=mdeulofeuth@alocredit.co
      # Cierre masivo + reasignacion de fin de mes (ultimo dia, 23:00)
      - MONTHLY_CLOSE_ENABLED=True
      - MONTHLY_CLOSE_HOUR=23
      - MONTHLY_CLOSE_MINUTE=0
      - NOTIFICATION_RECIPIENTS=mdeulofeuth@alocredit.co,fcamacho@alocredit.co,jcarrasco@alocredit.co
      - COBYSER_NOTIFICATION_RECIPIENTS=hcaballero@cobyser01.com,jcmartinez@cobyser01.com,fcamacho@alocredit.co,jcarrasco@alocredit.co,mdeulofeuth@alocredit.co
      - SERLEFIN_NOTIFICATION_RECIPIENTS=mdeulofeuth@alocredit.co,fcamacho@alocredit.co,jcarrasco@alocredit.co

      # SMTP (remitente de correos automaticos)
      - SMTP_SERVER=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_HELO_NAME=alocredit.co
      - SMTP_USER=notificacionesalo1@alocredit.co
      - SMTP_PASSWORD=nekzgpcxmbwomdfc
      - SMTP_FROM=notificacionesalo1@alocredit.co

      # Configuracion dinamica (persistida en DB interna)
      - DEFAULT_SERLEFIN_PERCENT=60
      - DEFAULT_COBYSER_PERCENT=40
      - DEFAULT_ASSIGNMENT_MIN_DAYS=61
      - DEFAULT_ASSIGNMENT_MAX_DAYS=240
      - INTERNAL_CONFIG_DATABASE_URL=postgresql+psycopg2://internal_config_user:internal_config_pass@internal-config-db:5432/internal_config_db
      - API_HMAC_SECRET=Nexus-Production-Key-2026
      # Rutas
      - REPORTS_DIR=/app/reports
      - LOCK_FILE=assignment_process.lock

    volumes:
      - ./reports:/app/reports
      - ./logs:/app/logs
      - ./app/data/contract_blacklist.txt:/app/app/data/contract_blacklist.txt
      - ./app/data/client_document_blacklist.txt:/app/app/data/client_document_blacklist.txt

    depends_on:
      internal-config-db:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s

    networks:
      - app-network

    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.25'
          memory: 512M



# ================================
# Redes
# ================================
networks:
  app-network:
    driver: bridge
