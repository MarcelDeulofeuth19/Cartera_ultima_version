# Configuracion del analisis SonarQube/SonarCloud.
sonar.projectKey=cartera-asignacion-api
sonar.projectName=Sistema de Asignacion de Cartera
sonar.projectVersion=1.0.0

# Codigo fuente y pruebas
sonar.sources=app,main.py
sonar.tests=tests
sonar.python.version=3.10,3.11,3.12

# Cobertura (generar con: pytest --cov=app --cov-report=xml)
sonar.python.coverage.reportPaths=coverage.xml

# Exclusiones: entornos, artefactos, datos y scripts operativos/desechables
sonar.exclusions=\
    .venv/**,\
    venv/**,\
    docker-data/**,\
    reports/**,\
    logs/**,\
    migrations/**,\
    scripts/**,\
    docs/**,\
    **/__pycache__/**

# Las listas de contratos fijos son datos inmutables, no logica
sonar.cpd.exclusions=app/data/manual_fixed_contracts.py
